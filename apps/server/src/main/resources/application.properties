spring.application.name=zm-baton-server
# 8080 is often taken on developer machines; the compat test uses 18081.
server.port=${ZM_BATON_SERVER_PORT:18081}
# Listen on this PC's loopback only. Anywhere else the server refuses to start unless authentication is
# required and TLS is set (docs/stage1/auth.md); opening it beyond this PC is the owner's decision.
server.address=${ZM_BATON_SERVER_ADDRESS:127.0.0.1}
# Authentication (docs/stage1/auth.md): local (the default; this PC only, every person request is the
# owner's) or required (people sign in on the Web, devices send their device token).
zm-baton.auth.mode=${ZM_BATON_AUTH:local}
# A person to make a one-time setup token for at start, in required mode: a forgotten password, or
# another person's first one. Remove it once the password is set.
zm-baton.auth.setup-for=${ZM_BATON_AUTH_SETUP:}
# TLS, with Spring Boot's own settings: a PKCS12 key store. Only the names are here; the path and the
# password come from the environment and are never stored, logged or exported.
server.ssl.enabled=${ZM_BATON_TLS_ENABLED:false}
server.ssl.key-store=${ZM_BATON_TLS_KEY_STORE:}
server.ssl.key-store-password=${ZM_BATON_TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${ZM_BATON_TLS_KEY_STORE_TYPE:PKCS12}
# Or a proxy in front ends TLS and forwards plain HTTP here: on says so (the sign-in cookie is then Secure).
zm-baton.tls.proxy=${ZM_BATON_TLS_PROXY:off}
# Inside a container that publishes its port on this PC's loopback only (deploy/compose): on lets the
# server listen on the container's every interface in local mode. Leave it off anywhere else.
zm-baton.network.published-on-loopback=${ZM_BATON_PUBLISHED_ON_LOOPBACK:off}
spring.datasource.url=${ZM_BATON_DB_URL:jdbc:postgresql://localhost:15432/zm_baton}
spring.datasource.username=${ZM_BATON_DB_USER:zm_baton}
spring.datasource.password=${ZM_BATON_DB_PASSWORD:}
management.endpoints.web.exposure.include=health
# Optional: serve a built Web screen from this server (docs/stage1/compat-test-ui.md),
# e.g. ZM_BATON_WEB_DIR=file:../web/dist/ . Same origin as the API, so no CORS is needed.
spring.web.resources.static-locations=${ZM_BATON_WEB_DIR:classpath:/static/}
# Retention (FN-1404, G13.1): days to keep each kind of record. Empty keeps it forever, which is
# the default: nothing is deleted until a person chooses a period (docs/stage1/audit-retention-export.md).
zm-baton.retention.audit-log-days=${ZM_BATON_RETENTION_AUDIT_LOG_DAYS:}
zm-baton.retention.ended-sessions-days=${ZM_BATON_RETENTION_ENDED_SESSIONS_DAYS:}
zm-baton.retention.closed-inbox-items-days=${ZM_BATON_RETENTION_CLOSED_INBOX_ITEMS_DAYS:}
zm-baton.retention.closed-notices-days=${ZM_BATON_RETENTION_CLOSED_NOTICES_DAYS:}
zm-baton.retention.ended-run-events-days=${ZM_BATON_RETENTION_ENDED_RUN_EVENTS_DAYS:}
# First-screen relay of a session's permission requests and questions: on or off (the default).
# It takes effect only with ZM_BATON_AUTH=required: without person sign-in any program on this PC could
# answer a relay, an AI session with a shell included (docs/hardening-backlog.md H-21). In local mode on
# is ignored with a warning in the log, and relays stay off.
zm-baton.relay=${ZM_BATON_RELAY:off}
# The master's contradiction checks (docs/stage1/contradictions.md). Automatic checks a day (0 turns
# them off), how many documents and decisions one check compares, and how many decisions one zm-docs
# import may bundle into one check. A master run's own limits come on top of its AI account's.
zm-baton.master.daily-limit=${ZM_BATON_MASTER_DAILY_LIMIT:5}
zm-baton.master.compare-limit=${ZM_BATON_MASTER_COMPARE_LIMIT:5}
zm-baton.master.import-limit=${ZM_BATON_MASTER_IMPORT_LIMIT:3}
zm-baton.master.max-turns=${ZM_BATON_MASTER_MAX_TURNS:5}
zm-baton.master.max-minutes=${ZM_BATON_MASTER_MAX_MINUTES:10}
zm-baton.master.max-budget-usd=${ZM_BATON_MASTER_MAX_BUDGET_USD:2.00}
# The API path is off unless the variable named here holds a key. Only the name is configured; the
# server reads the value when it sends a request and never stores, logs or exports it.
zm-baton.master.api.key-env=${ZM_BATON_MASTER_API_KEY_ENV:ZM_BATON_MASTER_API_KEY}
zm-baton.master.api.screen-model=${ZM_BATON_MASTER_API_SCREEN_MODEL:claude-haiku-5-5}
zm-baton.master.api.confirm-model=${ZM_BATON_MASTER_API_CONFIRM_MODEL:claude-opus-5-5}
zm-baton.master.api.account-id=${ZM_BATON_MASTER_API_ACCOUNT:}
zm-baton.master.api.prices=${ZM_BATON_MASTER_API_PRICES:claude-haiku-5-5=0.10/0.50,claude-sonnet-5-5=2.00/10.00,claude-opus-5-5=4.00/20.00}
